<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome - Mental Health Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: linear-gradient(to right, #eaf6f6, #ffffff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .home-container {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    .chatbot-icon {
      font-size: 50px;
      background: #2f8f9d;
      color: white;
      padding: 20px;
      border-radius: 50%;
      cursor: pointer;
      margin-top: 30px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .chatbot-icon:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-weight: bold;
      color: #2f4f4f;
    }

    .btn-custom {
      background-color: #2f8f9d;
      color: white;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      transition: background-color 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #276e76;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <h1>Welcome to Your Safe Space 🌿</h1>
    <p class="lead mb-4">Track your moods, talk with a supportive chatbot, and take care of your mental well-being.</p>
    
    <div class="d-flex justify-content-center gap-3">
      <a href="/moods" class="btn btn-custom">Mood Tracker</a>
      <a href="/chatbot" class="text-decoration-none">
        <div class="chatbot-icon">💬</div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
