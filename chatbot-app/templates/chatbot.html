<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mental Health Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #eaf6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .chat-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }

    #messages {
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #f9f9f9;
    }

    .message {
      padding: 10px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 75%;
      word-wrap: break-word;
    }

    .user {
      background-color: #2f8f9d;
      color: white;
      align-self: end;
    }

    .bot {
      background-color: #dfe7e9;
      color: #333;
      align-self: start;
    }

    #user_input {
      flex-grow: 1;
      margin-right: 10px;
    }

    .input-group {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h3 class="text-center text-secondary mb-4">Chat with Your Support Bot 💬</h3>
    <div id="messages"></div>
    <div class="input-group">
      <input type="text" id="user_input" class="form-control" placeholder="Type your message..." onkeydown="handleEnter(event)" />
      <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const inputField = document.getElementById("user_input");
    const messagesDiv = document.getElementById("messages");

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    async function sendMessage() {
      const userMessage = inputField.value.trim();
      if (!userMessage) return;

      addMessage(userMessage, "user");
      inputField.value = "";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: userMessage })
        });

        const data = await response.json();
        addMessage(data.response, "bot");
      } catch (err) {
        addMessage("Sorry, I couldn't connect to the server.", "bot");
      }
    }

    function addMessage(text, type) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${type}`;
      msgDiv.textContent = text;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
