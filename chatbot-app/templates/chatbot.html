<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-info-subtle">

  <div class="container py-5">
    <div class="card shadow-lg">
      <div class="card-header text-center bg-primary text-white">
        <h4 class="mb-0">How are you feeling today?</h4>
      </div>

      <div id="messages" class="card-body overflow-auto" style="height: 400px;"></div>

      <div class="card-footer d-flex">
        <input id="user_input" type="text" class="form-control me-2" placeholder="Type a message..." onkeydown="handleEnter(event)">
        <button class="btn btn-primary" onclick="sendMessage()" id="send_btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const inputField = document.getElementById("user_input");
    const sendBtn = document.getElementById("send_btn");

    function handleEnter(event) {
      if (event.key === "Enter") sendMessage();
    }

    async function sendMessage() {
      const userMessage = inputField.value.trim();
      if (!userMessage) return;

      const messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML += `<div class="text-end mb-2"><span class="badge bg-primary text-white p-2">${userMessage}</span></div>`;
      inputField.value = "";
      sendBtn.disabled = true;

      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
      });

      const data = await response.json();
      const botMessage = data.response;

      messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-light text-dark p-2">${botMessage}</span></div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      sendBtn.disabled = false;
    }
  </script>
</body>
</html>
